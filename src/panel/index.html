<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
    <title>Panefall</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="panel" id="panel">
      <header class="head part">
        <img class="logo" src="../../assets/icon.png" alt="" width="36" height="36" />
        <div class="title">
          <h1>Panefall</h1>
          <p id="status">Weather for your windows</p>
        </div>
        <button id="pause" class="round" type="button" title="Pause or resume (⌃⌥W)">
          <svg viewBox="0 0 24 24"><use id="pause-icon" href="#i-pause" /></svg>
        </button>
      </header>

      <section class="part">
        <h2>Weather</h2>
        <div class="chips">
          <button type="button" data-weather="snow"><svg viewBox="0 0 24 24"><use href="#i-snow" /></svg>Snow</button>
          <button type="button" data-weather="rain"><svg viewBox="0 0 24 24"><use href="#i-rain" /></svg>Rain</button>
          <button type="button" data-weather="storm"><svg viewBox="0 0 24 24"><use href="#i-storm" /></svg>Storm</button>
          <button type="button" data-weather="leaves"><svg viewBox="0 0 24 24"><use href="#i-leaves" /></svg>Leaves</button>
          <button type="button" data-weather="blossoms"><svg viewBox="0 0 24 24"><use href="#i-blossoms" /></svg>Blossoms</button>
          <button type="button" data-weather="clear"><svg viewBox="0 0 24 24"><use href="#i-clear" /></svg>Calm</button>
        </div>
        <button type="button" id="live" class="live">
          <svg viewBox="0 0 24 24"><use href="#i-pin" /></svg>
          <span id="live-label">Follow the real weather</span>
        </button>
        <label class="slider">
          <span>Intensity</span>
          <input type="range" data-setting="intensity" min="0" max="1" step="0.01" />
        </label>
      </section>

      <section class="part">
        <h2>Play</h2>
        <div class="toys">
          <button type="button" data-command="snowman"><span class="emoji">☃️</span>Snowman</button>
          <button type="button" data-command="snowball"><span class="emoji">❄️</span>Snowball</button>
          <button type="button" data-command="gust"><span class="emoji">🌬️</span>Gust</button>
          <button type="button" data-command="thunder"><span class="emoji">⚡️</span>Thunder</button>
          <button type="button" data-command="plow"><span class="emoji">🚜</span>Plow</button>
          <button type="button" data-command="sweep"><span class="emoji">🧹</span>Sweep</button>
        </div>
        <p class="hint"><kbd>⌃⌥M</kbd> builds a snowman right under your pointer, <kbd>⌃⌥B</kbd> throws a snowball at the window under it.</p>
      </section>

      <section class="part">
        <div class="row">
          <h2>Sounds</h2>
          <input type="checkbox" class="switch" data-setting="soundOn" aria-label="Ambient sound" />
        </div>
        <div class="mixer" id="mixer">
          <label class="slider"><span>🌧 Rain</span><input type="range" data-setting="soundRain" min="0" max="1" step="0.01" /></label>
          <label class="slider"><span>🌬 Wind</span><input type="range" data-setting="soundWind" min="0" max="1" step="0.01" /></label>
          <label class="slider"><span>🔥 Fireplace</span><input type="range" data-setting="soundFire" min="0" max="1" step="0.01" /></label>
          <label class="slider"><span>⛈ Thunder</span><input type="range" data-setting="soundThunder" min="0" max="1" step="0.01" /></label>
          <label class="slider"><span>Volume</span><input type="range" data-setting="soundMaster" min="0" max="1" step="0.01" /></label>
          <label class="check"><input type="checkbox" class="switch small" data-setting="soundMatch" />Follow the weather</label>
        </div>
      </section>

      <section class="part" id="music">
        <h2>Now playing</h2>
        <div class="track">
          <div class="art" id="art">♪</div>
          <div class="meta">
            <b id="track-title">Nothing playing</b>
            <small id="track-artist">Play something in Music or Spotify</small>
          </div>
        </div>
        <div class="transport">
          <button type="button" data-media="previous" title="Previous"><svg viewBox="0 0 24 24"><use href="#i-prev" /></svg></button>
          <button type="button" data-media="playpause" class="big" title="Play or pause"><svg viewBox="0 0 24 24"><use id="play-icon" href="#i-play" /></svg></button>
          <button type="button" data-media="next" title="Next"><svg viewBox="0 0 24 24"><use href="#i-next" /></svg></button>
        </div>
      </section>

      <footer class="foot part">
        <button type="button" id="open-control" class="link">Control Center…</button>
        <button type="button" id="quit" class="link">Quit</button>
      </footer>
    </div>

    <svg class="sprite" width="0" height="0" aria-hidden="true">
      <symbol id="i-snow" viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5 12 7l2.5-2.5M9.5 19.5 12 17l2.5 2.5M4 10.4l3.4-.9-.9-3.4M20 13.6l-3.4.9.9 3.4M4 13.6l3.4.9-.9 3.4M20 10.4l-3.4-.9.9-3.4" /></symbol>
      <symbol id="i-rain" viewBox="0 0 24 24"><path d="M6.5 14h10.5a3.5 3.5 0 0 0 .4-6.98A5 5 0 0 0 7.8 6.2 4 4 0 0 0 6.5 14z" /><path d="M8.5 17l-1 3M12.5 17l-1 3M16.5 17l-1 3" /></symbol>
      <symbol id="i-storm" viewBox="0 0 24 24"><path d="M6.5 14h10.5a3.5 3.5 0 0 0 .4-6.98A5 5 0 0 0 7.8 6.2 4 4 0 0 0 6.5 14z" /><path d="M12.5 15.5l-2 3.2h3l-2 3.3" /></symbol>
      <symbol id="i-leaves" viewBox="0 0 24 24"><path d="M5 19c0-8 5-14 14-14 0 9-6 14-14 14z" /><path d="M5 19 14.5 9.5" /></symbol>
      <symbol id="i-blossoms" viewBox="0 0 24 24"><circle cx="12" cy="7.3" r="2.8" /><circle cx="16.4" cy="10.5" r="2.8" /><circle cx="14.7" cy="15.7" r="2.8" /><circle cx="9.3" cy="15.7" r="2.8" /><circle cx="7.6" cy="10.5" r="2.8" /><circle cx="12" cy="12" r="1.3" /></symbol>
      <symbol id="i-clear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" /></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6-5.6-6-10.5a6 6 0 0 1 12 0C18 15.4 12 21 12 21z" /><circle cx="12" cy="10.5" r="2" /></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12" /></symbol>
      <symbol id="i-resume" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" /></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" /></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M7 6v12M18 6l-8.5 6 8.5 6z" /></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M17 6v12M6 6l8.5 6L6 18z" /></symbol>
    </svg>

    <script src="panel.js"></script>
  </body>
</html>
