<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
    <title>Panefall</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="panel" id="panel">
      <!-- A tiny live scene: the real weather engine, a little window and a snowman friend. -->
      <div class="scene part" id="scene">
        <div class="scene-win"><i></i><i></i><i></i></div>
        <canvas id="scene-canvas"></canvas>
        <span class="chip" id="place">Panefall</span>
        <button type="button" class="pause" id="pause" title="Pause or resume the weather (⌃⌥W)">⏸</button>
        <button type="button" class="close" id="close" title="Hide this panel (⌃⌥S)">✕</button>
      </div>

      <div class="weather part">
        <div class="bubbles">
          <button type="button" data-weather="snow" title="Snow">❄️</button>
          <button type="button" data-weather="rain" title="Rain">🌧️</button>
          <button type="button" data-weather="storm" title="Storm">⛈️</button>
          <button type="button" data-weather="leaves" title="Autumn leaves">🍂</button>
          <button type="button" data-weather="blossoms" title="Blossoms">🌸</button>
          <button type="button" data-weather="clear" title="Calm">☀️</button>
          <button type="button" id="live" title="Follow the real weather">📍</button>
        </div>
        <div class="now-line"><b id="weather-name">Snow</b><input type="range" id="intensity" data-setting="intensity" min="0" max="1" step="0.01" aria-label="Intensity" /></div>
      </div>

      <button type="button" class="play part" id="play">🧤 Play with the weather</button>

      <div class="toys part">
        <button type="button" data-command="snowman"><span>☃️</span>Snowman</button>
        <button type="button" data-command="snowball"><span>❄️</span>Snowball</button>
        <button type="button" data-command="gust"><span>🌬️</span>Gust</button>
        <button type="button" data-command="thunder"><span>⚡️</span>Thunder</button>
        <button type="button" data-command="sweep"><span>🧹</span>Sweep</button>
      </div>

      <div class="music part" id="music">
        <div class="art" id="art"><span id="art-note">♪</span><div class="eq" id="eq"><i></i><i></i><i></i><i></i></div></div>
        <div class="meta">
          <b id="track-title">Nothing playing</b>
          <small id="track-artist">Play music in an app or a browser tab</small>
          <span class="source" id="track-source"></span>
        </div>
        <div class="transport" id="transport">
          <button type="button" data-media="previous" title="Previous">⏮</button>
          <button type="button" data-media="playpause" class="big" id="playpause" title="Play or pause">⏯</button>
          <button type="button" data-media="next" title="Next">⏭</button>
        </div>
        <div class="browser-actions" id="browser-actions" hidden>
          <button type="button" class="go" id="go-tab">Go to tab ↗</button>
          <button type="button" class="go accent" id="enable-keys">🎛 Control it from here</button>
        </div>
      </div>

      <label class="cozy part">
        <span>🔥 Cozy sounds</span>
        <input type="range" data-setting="soundMaster" min="0" max="1" step="0.01" aria-label="Volume" />
        <input type="checkbox" class="switch" data-setting="soundOn" aria-label="Cozy sounds" />
      </label>

      <p class="tip part">💡 <kbd>⌃⌥M</kbd> snowman at your pointer · <kbd>⌃⌥H</kbd> play</p>

      <footer class="foot part">
        <button type="button" id="open-control">⚙️ Settings</button>
        <button type="button" id="quit">Quit</button>
      </footer>
    </div>

    <script src="../renderer/plow.js"></script>
    <script src="../renderer/sim.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
