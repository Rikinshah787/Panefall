<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Panefall</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #weather {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 1000;
      }

      /* Browser demo only (no Electron): a fake desktop with windows you can drag. */
      body.demo {
        background: linear-gradient(#0b1229 0%, #1d2b52 55%, #3d5283 100%);
        font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        user-select: none;
      }
      .demo-menubar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 26px;
        background: rgba(20, 24, 40, 0.55);
        backdrop-filter: blur(20px);
        z-index: 900;
      }
      .demo-window {
        position: fixed;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45), 0 0 0 0.5px rgba(0, 0, 0, 0.5);
        cursor: grab;
        touch-action: none;
      }
      .demo-window.light {
        background: #f6f6f7;
      }
      .demo-window.dark {
        background: #24262d;
      }
      .demo-window:active {
        cursor: grabbing;
      }
      .demo-window .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 12px;
      }
      .demo-window.light .bar {
        background: #ececee;
        color: #333;
        border-bottom: 1px solid #dadadd;
      }
      .demo-window.dark .bar {
        background: #2e3038;
        color: #ddd;
        border-bottom: 1px solid #1b1c21;
      }
      .demo-window .bar i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .demo-window .bar i:nth-child(1) {
        background: #ff5f57;
      }
      .demo-window .bar i:nth-child(2) {
        background: #febc2e;
      }
      .demo-window .bar i:nth-child(3) {
        background: #28c840;
      }
      .demo-window .bar b {
        margin-left: 8px;
        font-weight: 600;
      }
      .demo-dock {
        position: fixed;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        z-index: 900;
      }
      .demo-dock i {
        width: 46px;
        height: 46px;
        border-radius: 11px;
      }
    </style>
  </head>
  <body>
    <canvas id="weather"></canvas>
    <script src="sim.js"></script>
    <script src="plow.js"></script>
    <script src="sound.js"></script>
    <script src="demo.js"></script>
    <script src="app.js"></script>
  </body>
</html>
